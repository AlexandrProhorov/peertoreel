<div class="shell">
  <header class="shell__header">
    <a class="shell__brand" routerLink="/health" aria-label="Peer to Reel — на главную">
      <span class="shell__mark">P2R</span>
      <span>
        <strong>Peer to Reel</strong>
        <small>AI Content Factory</small>
      </span>
    </a>

    <nav class="shell__nav" aria-label="Основная навигация">
      <a
        routerLink="/health"
        routerLinkActive="shell__nav-link--active"
        class="shell__nav-link"
      >
        Состояние системы
      </a>
      <a
        routerLink="/system"
        routerLinkActive="shell__nav-link--active"
        class="shell__nav-link"
      >
        Очередь
      </a>
      <a
        routerLink="/runs"
        routerLinkActive="shell__nav-link--active"
        class="shell__nav-link"
      >
        Прогоны
      </a>
      <a
        routerLink="/accounts"
        routerLinkActive="shell__nav-link--active"
        class="shell__nav-link"
      >
        Аккаунты
      </a>
    </nav>

    @if (session.user(); as user) {
      <div class="shell__user">
        <span class="shell__user-name">{{ user.displayName }}</span>
        <button
          class="shell__nav-link shell__logout"
          type="button"
          (click)="logout()"
        >
          Выйти
        </button>
      </div>
    }
  </header>

  <main class="shell__main">
    <router-outlet />
  </main>

  <footer class="shell__footer">
    <span>Peer to Reel {{ currentYear }}</span>
    <span>Pipeline core · M2</span>
  </footer>
</div>
